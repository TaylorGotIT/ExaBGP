process announce-routes {
    run /venv/bin/python /exabgp/http_api.py;
    encoder text;
}

neighbor __TARGET_NEIGHBOR__ {
    router-id __ROUTER_ID__;
    local-address __LOCAL_ADDRESS__;
    local-as __LOCAL_AS__;
    peer-as __PEER_AS__;

    family {
        ipv4 unicast;
    }

    static {

    }
}

