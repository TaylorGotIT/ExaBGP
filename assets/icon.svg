<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ExaBGP">
  <title>ExaBGP</title>
  <desc>ExaBGP：Python 蛇 + 全球 IP 网络 + BGP 会话 + Web 控制台</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111b30"/>
      <stop offset="1" stop-color="#18233d"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#1b4a6b"/>
      <stop offset="0.55" stop-color="#113050"/>
      <stop offset="1" stop-color="#0a1828"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#6d8dff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snake" x1="0.05" y1="0.9" x2="0.95" y2="0.2">
      <stop offset="0" stop-color="#19a97f"/>
      <stop offset="0.45" stop-color="#2dd4a7"/>
      <stop offset="1" stop-color="#5cc8f5"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2745"/>
      <stop offset="1" stop-color="#121b2e"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#8ea0c0" opacity="0.10"/>
    </pattern>
    <clipPath id="winClip"><rect x="286" y="326" width="196" height="128" rx="20"/></clipPath>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#5cc8f5"/>
    </marker>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#dots)"/>
  <circle cx="240" cy="240" r="230" fill="url(#glow)"/>

  <!-- 地球：经纬网格 + IP 点位 -->
  <g>
    <circle cx="212" cy="252" r="134" fill="url(#globe)" stroke="#3a5f8c" stroke-width="6"/>
    <path d="M126 168 A134 134 0 0 1 286 122" fill="none" stroke="#8ec6f2" stroke-opacity="0.16" stroke-width="12" stroke-linecap="round"/>
    <g fill="none" stroke="#5b8fc4">
      <ellipse cx="212" cy="252" rx="57" ry="134" stroke-width="3.4" opacity="0.5"/>
      <ellipse cx="212" cy="252" rx="106" ry="134" stroke-width="3" opacity="0.3"/>
      <ellipse cx="212" cy="252" rx="134" ry="50" stroke-width="3.4" opacity="0.45"/>
      <ellipse cx="212" cy="252" rx="134" ry="99" stroke-width="3" opacity="0.26"/>
      <path d="M212 118 A134 134 0 0 1 212 386" stroke-width="0" />
    </g>
    <g>
      <circle cx="152" cy="196" r="6" fill="#5cc8f5"/>
      <circle cx="252" cy="176" r="5" fill="#2dd4a7"/>
      <circle cx="176" cy="300" r="5" fill="#f5b85c"/>
      <circle cx="262" cy="286" r="6" fill="#5cc8f5"/>
      <circle cx="228" cy="228" r="4" fill="#8fd9ff" opacity="0.8"/>
      <circle cx="120" cy="252" r="4" fill="#2dd4a7" opacity="0.8"/>
    </g>
  </g>

