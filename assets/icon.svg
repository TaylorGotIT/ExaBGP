  <circle cx="127.7" cy="189.5" r="2.9" fill="#0b1220" opacity="0.15"/><circle cx="165.9" cy="161.5" r="3.4" fill="#0b1220" opacity="0.15"/><circle cx="219.5" cy="159.9" r="3.8" fill="#0b1220" opacity="0.15"/><circle cx="279.8" cy="175.6" r="4.1" fill="#0b1220" opacity="0.15"/>

  <!-- 控制台窗口 -->
  <g>
    <rect x="116" y="288" width="280" height="166" rx="26" fill="url(#win)" stroke="#2e4066" stroke-width="6"/>
    <g clip-path="url(#winClip)">
      <rect x="116" y="288" width="280" height="44" fill="#1d2947"/>
      <circle cx="150" cy="310" r="6.4" fill="#f4716e"/>
      <circle cx="172" cy="310" r="6.4" fill="#f5b85c"/>
      <circle cx="194" cy="310" r="6.4" fill="#2dd4a7"/>
      <rect x="140" y="354" width="126" height="11" rx="5.5" fill="#33456b"/>
      <rect x="140" y="378" width="188" height="11" rx="5.5" fill="#2b3a5c"/>
      <rect x="140" y="402" width="104" height="11" rx="5.5" fill="#2b3a5c"/>
      <path d="M300 430 L324 404 L344 416 L374 376" fill="none" stroke="url(#bar)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="374" cy="376" r="7" fill="#5cc8f5"/>
    </g>
  </g>

  <!-- 蛇头 -->
  <g transform="rotate(18 372 216)">
    <ellipse cx="372" cy="216" rx="31" ry="23" fill="url(#snake)"/>
    <ellipse cx="384" cy="208" rx="8.5" ry="8.5" fill="#ffffff"/>
    <ellipse cx="386" cy="208" rx="4" ry="4" fill="#0b1220"/>
  </g>
  <path d="M398 224 L418 215 M398 224 L418 233" stroke="#f4716e" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- BGP 路由宣告 -->
  <path d="M15 0 L-9 11 L-9 -11 Z" fill="#5cc8f5" opacity="1.0" transform="translate(424,182) rotate(-45)"/><path d="M13 0 L-8 10 L-8 -10 Z" fill="#5cc8f5" opacity="0.72" transform="translate(452,156) rotate(-45)"/><path d="M11 0 L-7 8 L-7 -8 Z" fill="#5cc8f5" opacity="0.5" transform="translate(480,130) rotate(-45)"/>
</svg>
