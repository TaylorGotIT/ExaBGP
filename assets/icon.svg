<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ExaBGP">
  <title>ExaBGP</title>
  <desc>ExaBGP 路由引擎徽标：Python 蛇 + Web 控制台 + BGP 路由宣告</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111b30"/>
      <stop offset="1" stop-color="#18233d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#6d8dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snake" x1="0.05" y1="0.9" x2="0.95" y2="0.2">
      <stop offset="0" stop-color="#19a97f"/>
      <stop offset="0.45" stop-color="#2dd4a7"/>
      <stop offset="1" stop-color="#5cc8f5"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2745"/>
      <stop offset="1" stop-color="#121b2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d8dff"/>
      <stop offset="1" stop-color="#5cc8f5"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#8ea0c0" opacity="0.10"/>
    </pattern>
    <clipPath id="winClip"><rect x="116" y="288" width="280" height="166" rx="26"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#dots)"/>
  <circle cx="256" cy="230" r="215" fill="url(#glow)"/>

