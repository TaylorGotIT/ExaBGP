  <circle cx="113.2" cy="208.8" r="2.7" fill="#0b1220" opacity="0.15"/><circle cx="180.8" cy="142.3" r="3.4" fill="#0b1220" opacity="0.15"/><circle cx="238.3" cy="124.4" r="3.8" fill="#0b1220" opacity="0.15"/><circle cx="291.3" cy="130.9" r="4.1" fill="#0b1220" opacity="0.15"/>
  <g transform="rotate(28 352 176)">
    <ellipse cx="352" cy="176" rx="30" ry="22" fill="url(#snake)"/>
    <ellipse cx="364" cy="169" rx="8" ry="8" fill="#ffffff"/>
    <ellipse cx="366" cy="169" rx="3.8" ry="3.8" fill="#0b1220"/>
  </g>
  <path d="M376 186 L392 180 M376 186 L392 192" stroke="#f4716e" stroke-width="4.2" stroke-linecap="round" fill="none"/>

  <!-- BGP 会话：虚线 + 标签 -->
  <path d="M398 146 L484 108" stroke="#5cc8f5" stroke-width="5.5" stroke-linecap="round"
        stroke-dasharray="13 11" marker-end="url(#arrow)" opacity="0.95"/>
  <g>
    <rect x="384" y="206" width="112" height="52" rx="26" fill="#0f1a2c" stroke="#5cc8f5" stroke-width="3.4"/>
    <text x="440" y="243" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
          font-size="28" font-weight="700" letter-spacing="3" fill="#bfe6ff">BGP</text>
  </g>

  <!-- 控制台窗口 -->
  <g>
    <rect x="286" y="326" width="196" height="128" rx="20" fill="url(#win)" stroke="#2e4066" stroke-width="5"/>
    <g clip-path="url(#winClip)">
      <rect x="286" y="326" width="196" height="34" fill="#1c2846"/>
      <circle cx="308" cy="343" r="5" fill="#f4716e"/>
      <circle cx="325" cy="343" r="5" fill="#f5b85c"/>
      <circle cx="342" cy="343" r="5" fill="#2dd4a7"/>
      <rect x="304" y="378" width="86" height="9" rx="4.5" fill="#33456b"/>
      <rect x="304" y="397" width="130" height="9" rx="4.5" fill="#2b3a5c"/>
      <path d="M400 440 L418 418 L432 428 L454 396" fill="none" stroke="#5cc8f5" stroke-width="6"
