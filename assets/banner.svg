<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1b"/>
      <stop offset="0.55" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#18233d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#6d8dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fb4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4a7"/>
      <stop offset="1" stop-color="#5cc8f5"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#8ea0c0" opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <circle cx="300" cy="330" r="420" fill="url(#glow)"/>

  <image href="icon-mark.png" x="112" y="150" width="366" height="300"/>

  <text x="540" y="268" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="104"
        font-weight="800" letter-spacing="1" fill="url(#title)">ExaBGP</text>
  <rect x="546" y="296" width="150" height="7" rx="3.5" fill="url(#accent)"/>

  <text x="542" y="372" font-family="Segoe UI, 'Microsoft YaHei', Arial, sans-serif" font-size="36"
        font-weight="600" fill="#c9d8ef">多源采集 · 分组传播 · 可视化下发</text>
  <text x="542" y="424" font-family="Segoe UI, 'Microsoft YaHei', Arial, sans-serif" font-size="30"
        fill="#8ea0c0">为 BGP 选路而生的路由注入平台</text>

  <text x="542" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="24"
        fill="#6d8dff">Python 3.11  ·  exabgp 4.2.11  ·  Web 控制台  ·  Docker 一键部署</text>
</svg>
