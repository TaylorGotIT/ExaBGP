name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（默认当前 ref）"
        required: false

permissions:
  contents: write      # 用于把镜像包作为 release 附件上传
  packages: write      # 用于推送 ghcr.io

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/exabgp" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=ExaBGP Route Injector
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.tag }}

      - name: Export offline image tarball
        run: |
          set -e
          IMG="${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          docker pull "$IMG"
          OUT="exabgp-${{ steps.vars.outputs.tag }}-image.tar.gz"
          docker save "$IMG" | gzip -9 > "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            exabgp-${{ steps.vars.outputs.tag }}-image.tar.gz
            exabgp-${{ steps.vars.outputs.tag }}-image.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
